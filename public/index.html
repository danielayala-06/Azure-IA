<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resident Evil Chatbot</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-black text-light">

  <!-- TOP BAR -->
  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">
        🧟 Resident Evil AI Chatbot
      </span>
      <span class="text-secondary small">Azure Fine-Tuned Model</span>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <div class="container d-flex justify-content-center align-items-center vh-100">

    <!-- CHAT CARD -->
    <div class="card bg-dark border-secondary shadow-lg w-75">

      <!-- CHAT HEADER -->
      <div class="card-header bg-dark border-secondary d-flex align-items-center">
        <i class="bi bi-robot me-2"></i>
        <strong>Umbrella Assistant</strong>
      </div>

      <!-- CHAT BODY -->
      <div class="card-body overflow-auto" style="height: 450px;">

        <!-- Bot message -->
        <div class="d-flex mb-3">
          <div class="bg-secondary text-light p-2 rounded-3">
            Bienvenido agente. ¿Qué deseas saber sobre Resident Evil?
          </div>
        </div>

        <!-- User message -->
        <div class="d-flex justify-content-end mb-3">
          <div class="bg-primary text-white p-2 rounded-3">
            ¿Quién es Wesker?
          </div>
        </div>

        <!-- Bot message -->
        <div class="d-flex mb-3">
          <div class="bg-secondary text-light p-2 rounded-3">
            Albert Wesker es uno de los principales antagonistas de la saga.
          </div>
        </div>

      </div>

      <!-- INPUT AREA -->
      <div class="card-footer bg-dark border-secondary">
        <div class="input-group">
          <span class="input-group-text bg-dark text-light border-secondary">
            <i class="bi bi-chat-dots"></i>
          </span>

          <input type="text" class="form-control bg-dark text-light border-secondary"
                 placeholder="Escribe sobre Umbrella, virus, personajes...">

          <button class="btn btn-danger">
            <i class="bi bi-send"></i>
          </button>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
